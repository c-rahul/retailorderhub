<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders — RetailOrderHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>RetailOrderHub</h1>
    <p class="tagline">E-Commerce Order Management — System Design Training</p>
    <nav>
        <a th:href="@{/}">Catalog</a> | <a th:href="@{/orders}">Orders</a>
    </nav>

    <h2>All Orders</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>Customer</th><th>Items</th><th>Payment</th>
            <th>Amount</th><th>Status</th><th>Created</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.customerId}">CUST-001</td>
            <td th:text="${order.itemNames}">Laptop, Mouse</td>
            <td th:text="${order.paymentMethod}">CREDIT_CARD</td>
            <td th:text="${'$' + #numbers.formatDecimal(order.amount, 1, 2)}">0.00</td>
            <td th:text="${order.status}">PENDING</td>
            <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}">timestamp</td>
        </tr>
        <tr th:if="${orders.isEmpty()}">
            <td colspan="7" class="empty">No orders placed yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
